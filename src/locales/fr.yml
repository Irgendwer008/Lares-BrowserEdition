addRuleTemplateGroupNote: "Tous les sites de ce modèle partagent une limite et peuvent être activés ou désactivés ensemble."
addRuleTemplatesIntro: "Bloque un service avec ses autres adresses."
addRuleTemplateLimitNote: "Chaque site reçoit sa propre limite quotidienne."
pauseBody: "Tous les sites sont autorisés pendant la durée choisie. La pause se termine automatiquement – aussi quand le navigateur est fermé."
settingsLockedHint: "Assouplir les paramètres (désactiver, code du gardien, heure de réinitialisation ou canaux de notification) demande le code du gardien."
