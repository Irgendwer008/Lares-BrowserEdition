setupIntroBody: "Lares bloque les sites que tu choisis. Ajouter des restrictions est toujours possible – les supprimer ou les assouplir demande un code que seule une personne de confiance connaît : ton gardien, par exemple un ami ou un membre de ta famille.\n\nPour les étapes suivantes, confie l’ordinateur à ton gardien."
setupMethodBody: "Le code est nécessaire chaque fois que des restrictions sont mises en pause ou assouplies. Ne le dis pas à la personne qui utilise le navigateur."
setupMethodPasswordDesc: "Tu définis maintenant un mot de passe et tu le saisis ici chaque fois qu’il est nécessaire."
setupMethodTotpDesc: "Des codes d’une appli sur ton propre téléphone (p. ex. Aegis ou FreeOTP). Chaque code ne fonctionne qu’une fois, tu peux donc aussi l’envoyer par message."
setupTotpBody: "Ouvre ton appli d’authentification, ajoute un nouveau compte et scanne ce code. Saisis ensuite le code à 6 chiffres affiché par l’appli."
setupTotpWrong: "Ce code ne correspond pas. Vérifie que l’heure est correcte sur les deux appareils et saisis le code actuel."
setupRecoverySave: "Enregistrer comme fichier"
setupRecoveryExportWarning: "Gardien : garde le code pour toi (note-le, ou enregistre le fichier et envoie-le-toi). Une copie dans le presse-papiers ou dans le dossier des téléchargements reste sur cet ordinateur – supprime-la ensuite."
homeEmptyHint: "Touche « Ajouter » pour bloquer ton premier site – ou commence avec un modèle."
groupExplanation: "Tous les sites d’un groupe partagent cette limite – leur temps s’additionne. L’interrupteur les active ou désactive tous ensemble."
