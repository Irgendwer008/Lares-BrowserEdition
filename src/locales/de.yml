setupIntroBody: "Lares sperrt die Websites, die du auswählst. Einschränkungen hinzufügen geht immer – sie zu entfernen oder zu lockern, braucht einen Code, den nur eine Vertrauensperson kennt: dein Guardian, zum Beispiel ein Freund oder ein Familienmitglied.\n\nGib den Computer für die nächsten Schritte bitte deinem Guardian."
setupMethodBody: "Der Code wird gebraucht, wann immer Einschränkungen pausiert oder gelockert werden. Verrate ihn nicht der Person, die den Browser nutzt."
setupMethodPasswordDesc: "Du legst jetzt ein Passwort fest und tippst es hier ein, wann immer es gebraucht wird."
setupMethodTotpDesc: "Codes aus einer App auf deinem eigenen Handy (z. B. Aegis oder FreeOTP). Jeder Code funktioniert nur einmal – du kannst ihn also auch per Nachricht schicken."
setupTotpBody: "Öffne deine Authenticator-App, füge ein neues Konto hinzu und scanne diesen Code. Gib dann den 6-stelligen Code ein, den die App anzeigt."
setupTotpWrong: "Dieser Code passt nicht. Prüfe, ob die Uhrzeit auf beiden Geräten stimmt, und gib den aktuellen Code ein."
setupRecoverySave: "Als Datei speichern"
setupRecoveryExportWarning: "Guardian: Bewahre den Code für dich auf (aufschreiben oder die Datei speichern und dir selbst schicken). Eine Kopie in der Zwischenablage oder im Download-Ordner bleibt auf diesem Computer – entferne sie danach."
homeEmptyHint: "Tippe auf „Hinzufügen“, um deine erste Website zu sperren – oder starte mit einer Vorlage."
groupExplanation: "Alle Websites einer Gruppe teilen sich dieses Limit – ihre Zeit wird zusammengezählt. Der Schalter schaltet alle gemeinsam ein oder aus."
groupEmpty: "Noch keine Websites in dieser Gruppe."
