settingsLockedHint: "Einstellungen lockern (ausschalten, Guardian-Code, Rücksetzzeit oder Benachrichtigungskanäle) braucht den Guardian-Code."
settingsWarnDesc: "Wird als Browser-Benachrichtigung angezeigt."
