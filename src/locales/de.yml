addRuleTemplateGroupNote: "Alle Websites dieser Vorlage teilen sich ein Limit und lassen sich gemeinsam ein- oder ausschalten."
addRuleTemplatesIntro: "Sperrt einen Dienst zusammen mit seinen anderen Adressen."
addRuleTemplateLimitNote: "Jede Website bekommt ihr eigenes Tageslimit."
